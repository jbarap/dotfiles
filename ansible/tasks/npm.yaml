- name: Check for fnm
  ansible.builtin.shell: command -v fnm
  register: fnm_exists
  ignore_errors: true

# cargo-binstall fetches a prebuilt fnm binary into ~/.cargo/bin (already on PATH).
- name: Install fnm
  when: fnm_exists is failed
  ansible.builtin.command: cargo binstall --no-confirm fnm
  environment:
    PATH: "{{ lookup('env', 'HOME') }}/.cargo/bin:{{ lookup('env', 'PATH') }}"

# Swap --lts for --latest to track the current (non-LTS) release instead.
- name: Install default Node via fnm
  when: fnm_exists is failed
  ansible.builtin.shell: |
    set -e
    eval "$(fnm env)"
    fnm install --lts
    fnm default "$(fnm ls | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1)"
  args:
    executable: /bin/bash
  environment:
    PATH: "{{ lookup('env', 'HOME') }}/.cargo/bin:{{ lookup('env', 'PATH') }}"
