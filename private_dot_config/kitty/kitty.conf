# vim:fileencoding=utf-8:ft=conf:foldmethod=marker

# Kitty gets angry on wayland
linux_display_server x11

#: Fonts {{{

# Hack
#font_family      Hack
#bold_font        Bold
#italic_font      Italic
#bold_italic_font Bold Italic

# Jetbrains mono
font_family      family="JetBrains Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto

# NOTE: The mono version has icons that fill a whole character space
# Mappings suggested by: https://sw.kovidgoyal.net/kitty/faq/#kitty-is-not-able-to-use-my-favorite-font
# Nerd Fonts v3.4.0
symbol_map U+e000-U+e00a,U+e0a0-U+e0a2,U+e0a3,U+e0b0-U+e0b3,U+e0b4-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b7,U+e700-U+e8ef,U+ea60-U+ec1e,U+ed00-U+efce,U+f000-U+f2ff,U+f300-U+f381,U+f400-U+f533,U+f0001-U+f1af0 Symbols Nerd Font Mono

font_size  10

adjust_line_height  0
adjust_column_width 0
#: }}}


#: Cursor customization {{{
cursor_shape block

cursor_blink_interval 0
# cursor_trail 3
# cursor_trail_decay 0.1 0.2
#: }}}


#: Scrollback {{{
scrollback_lines 2000
#: }}}


#: Mouse {{{
url_color #0087bd

url_style single
#: }}}


#: Performance tuning {{{
repaint_delay 10

input_delay 3

sync_to_monitor yes
#: }}}


#: Terminal bell {{{
enable_audio_bell no
#: }}}


#: Window layout {{{
window_border_width 0.0
draw_minimal_borders yes

window_margin_width 0.0

window_padding_width 0.0

hide_window_decorations yes
# }}}


# Tab bar {{{
tab_bar_edge bottom

tab_bar_margin_width 0.0

tab_bar_style separator

tab_separator " ▏"
#: }}}


#: Color scheme {{{
include colors.conf
#: }}}


#: Advanced {{{
allow_remote_control yes
#: }}}


#: OS specific tweaks {{{
#: }}}


#: Keyboard shortcuts {{{
# I'm using tmux for everything atm
kitty_mod ctrl+shift
clear_all_shortcuts yes

#: Clipboard {{{
map kitty_mod+c copy_to_clipboard
map kitty_mod+v  paste_from_clipboard
#: }}}

#: Scrolling {{{
#: }}}

#: Window management {{{
#: }}}

#: Tab management {{{
map kitty_mod+alt+t set_tab_title
#: }}}

#: Layout management {{{
#: }}}

#: Font sizes {{{
map kitty_mod+equal     change_font_size  all +1
map kitty_mod+minus     change_font_size  all -1
#: }}}

#: Select and act on visible text {{{
#: }}}

#: Miscellaneous {{{
#: }}}
# }}}
